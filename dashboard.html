<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ShareFIT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0a0a0a;
      --white:   #f5f5f5;
      --muted:   #737373;
      --surface: #141414;
      --border:  #2e2e2e;
      --card-bg: #111111;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--black); color: var(--white);
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 5%; border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; color: var(--white); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 1.5rem; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 0.88rem; transition: color 0.2s; }
    .nav-link:hover { color: var(--white); }
    .btn-logout {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 0.45rem 1.1rem; border-radius: 999px; font-size: 0.85rem;
      font-family: inherit; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #555; color: var(--white); }

    /* ── Loader ── */
    #loading {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.95rem; letter-spacing: 0.04em;
    }

    /* ── Main content (hidden until auth confirmed) ── */
    #content { display: none; flex: 1; padding: 3.5rem 5%; }

    .greeting { margin-bottom: 3rem; }
    .greeting .label {
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
    }
    .greeting h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 900; letter-spacing: -1px; }
    .greeting p  { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }

    /* ── Stat cards ── */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 3rem;
    }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 1rem; padding: 1.5rem;
    }
    .stat-card .num { font-size: 2rem; font-weight: 900; letter-spacing: -1px; }
    .stat-card .desc { font-size: 0.82rem; color: var(--muted); margin-top: 0.25rem; }

    /* ── Quick actions ── */
    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: #bbb; letter-spacing: 0.01em; }

    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .action-btn {
      background: var(--card-bg); border: 1px solid var(--border);
      color: var(--white); padding: 0.7rem 1.4rem; border-radius: 0.6rem;
      font-size: 0.88rem; font-family: inherit; cursor: pointer;
      text-decoration: none; transition: border-color 0.2s, background 0.2s;
    }
    .action-btn:hover { border-color: #555; background: #1a1a1a; }
    .action-btn.primary {
      background: var(--white); color: var(--black); border-color: var(--white); font-weight: 700;
    }
    .action-btn.primary:hover { background: #d4d4d4; border-color: #d4d4d4; }

    /* ── Account info ── */
    .account-section { margin-top: 3rem; }
    .info-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 1rem; overflow: hidden; max-width: 480px;
    }
    .info-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .key { font-size: 0.82rem; color: var(--muted); }
    .info-row .val { font-size: 0.88rem; font-weight: 600; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">ShareFIT</a>
    <div class="nav-right">
      <a href="/marketplace.html" class="nav-link">Browse</a>
      <a href="/chat.html"        class="nav-link">Messages</a>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </nav>

  <div id="loading">Authenticating…</div>

  <div id="content">
    <div class="greeting">
      <div class="label">Dashboard</div>
      <h1>Hey, <span id="username-display">—</span> 👋</h1>
      <p>Welcome to your ShareFIT account.</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="num" id="stat-items">—</div>
        <div class="desc">Items listed</div>
      </div>
      <div class="stat-card">
        <div class="num">0</div>
        <div class="desc">Active rentals</div>
      </div>
      <div class="stat-card">
        <div class="num">฿0</div>
        <div class="desc">Total earned</div>
      </div>
    </div>

    <div>
      <p class="section-title">Quick actions</p>
      <div class="actions">
        <a href="/marketplace.html" class="action-btn primary">Browse pieces</a>
        <a href="/list-item.html"   class="action-btn">List an item</a>
        <a href="/chat.html"        class="action-btn">Messages</a>
      </div>
    </div>

    <div class="account-section">
      <p class="section-title">Account info</p>
      <div class="info-card">
        <div class="info-row">
          <span class="key">Username</span>
          <span class="val" id="info-username">—</span>
        </div>
        <div class="info-row">
          <span class="key">Email</span>
          <span class="val" id="info-email">—</span>
        </div>
        <div class="info-row">
          <span class="key">Member since</span>
          <span class="val" id="info-created">—</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
